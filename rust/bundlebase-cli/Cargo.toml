[package]
name = "bundlebase-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
authors.workspace = true
description = "Command-line interface for bundlebase data processing"

[[bin]]
name = "bundlebase"
path = "src/main.rs"

[lib]
name = "bundlebase_cli"
path = "src/lib.rs"

[dependencies]
bundlebase = { path = "../bundlebase" }
bundlebase-catalog = { workspace = true }
bundlebase-command = { workspace = true }
bundlebase-common = { path = "../bundlebase-common" }
bundlebase-io = { workspace = true }
arrow = { workspace = true }
arrow-schema = { workspace = true }
arrow-flight = { workspace = true }
datafusion = { workspace = true }
tonic = { workspace = true }
tokio = { workspace = true }
clap = { version = "4", features = ["derive"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-log = "0.2"
serde = { workspace = true }
serde_yaml_ng = { workspace = true }
serde_json = { workspace = true }
async-stream = "0.3"
async-trait = { workspace = true }
futures = { workspace = true }
bytes = { workspace = true }
reedline = "0.45"
dirs = "6"
comfy-table = "7.2"
anyhow = "1.0"
indicatif = "0.18"
parking_lot = { workspace = true }
uuid = { workspace = true }
once_cell = "1.21"
prost = "0.14"
base64 = "0.22"
bundlebase-report = { path = "../bundlebase-report" }
rmcp = { version = "1.2", features = ["server", "transport-io"] }
schemars = "1"

[dev-dependencies]
rstest = { workspace = true }
tempfile = { workspace = true }
bytes = { workspace = true }
