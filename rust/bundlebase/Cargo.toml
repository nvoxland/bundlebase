[package]
name = "bundlebase"
version.workspace = true
edition.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
authors.workspace = true
description = "High-performance data processing library with Apache Arrow and DataFusion"
autobenches = false

[lib]
crate-type = ["rlib"]

[features]
default = ["connector-postgres", "connector-kaggle", "connector-web-scrape"]
connector-postgres = ["bundlebase-connector/connector-postgres"]
connector-kaggle = ["bundlebase-connector/connector-kaggle"]
connector-web-scrape = ["bundlebase-connector/connector-web-scrape"]

[dependencies]
bundlebase-common = { workspace = true }
bundlebase-connector = { workspace = true }
bundlebase-index = { workspace = true }
bundlebase-io = { workspace = true }
datafusion = { workspace = true }
arrow = { workspace = true }
arrow-schema = { workspace = true }
pest = { workspace = true }
pest_derive = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_yaml_ng = { workspace = true }
serde_json = { workspace = true }
tar = { workspace = true }
url = { version = "2.5", features = ["serde"] }
object_store = { version = "0.12", features = ["aws", "gcp", "azure"] }
async-trait = { workspace = true }
parking_lot = { workspace = true }
futures = { workspace = true }
lazy_static = "1.5"
libloading = "0.8"
bytes = { workspace = true }
log = "0.4"
tracing = { workspace = true }
sha2 = "0.10"
hex = "0.4"
parquet = "57.3.0"
rand = "0.9"
chrono = { version = "0.4", features = ["serde"] }
uuid = { workspace = true }
regex = "1.12.3"
opentelemetry = { workspace = true }
opentelemetry_sdk = { workspace = true, features = ["metrics", "trace"] }
opentelemetry-stdout = { version = "0.31", features = ["metrics", "trace"]}
reqwest = { version = "0.13", default-features = false, features = ["rustls", "stream"] }

tempfile = { workspace = true }
tokio-util = { workspace = true }
dashmap = "6"
libc = "0.2"

[dev-dependencies]
rstest = { workspace = true }
env_logger = "0.11"
serial_test = "3.3"
wiremock = "0.6"
criterion = { version = "0.8", features = ["async_tokio"] }

[[bench]]
name = "bundle_lifecycle"
harness = false

[[bench]]
name = "query_execution"
harness = false

[[bench]]
name = "index_operations"
harness = false

[[bench]]
name = "streaming"
harness = false

[[bench]]
name = "command_operations"
harness = false

[[bench]]
name = "indexed_queries"
harness = false
