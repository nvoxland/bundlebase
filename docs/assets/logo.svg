<!-- v6-a: v3-e with larger gap between cylinders (4px more space).
     Bars and ticks unchanged — the gap makes the "binding" feel more intentional. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none">
  <!-- cylinder 1 (top) -->
  <path d="M 4,2.5 A 8,2 0 0 1 20,2.5 L 20,7.5 A 8,2 0 0 1 4,7.5 Z"
        fill="currentColor" fill-opacity="0.1" stroke="currentColor" stroke-width="1.3"/>
  <ellipse cx="12" cy="2.5" rx="8" ry="2" fill="currentColor" fill-opacity="0.5" stroke="currentColor" stroke-width="1.3"/>

  <!-- cylinder 2 (bottom) — dropped to give a wider gap -->
  <path d="M 4,14.5 A 8,2 0 0 1 20,14.5 L 20,20.5 A 8,2 0 0 1 4,20.5 Z"
        fill="currentColor" fill-opacity="0.1" stroke="currentColor" stroke-width="1.3"/>
  <ellipse cx="12" cy="14.5" rx="8" ry="2" fill="currentColor" fill-opacity="0.5" stroke="currentColor" stroke-width="1.3"/>

  <!-- binding bars — span top of cyl1 to bottom of cyl2 -->
  <path d="M 1.5,3.5 L 1.5,19.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M 22.5,3.5 L 22.5,19.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
  <!-- end ticks -->
  <path d="M 1.5,3.5 L 3,3.5"   stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M 1.5,19.5 L 3,19.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M 22.5,3.5 L 21,3.5"   stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M 22.5,19.5 L 21,19.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
</svg>
