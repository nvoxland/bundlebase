[workspace]
members = [
    "rust/bundlebase-common",
    "rust/bundlebase-ossie",
    "rust/bundlebase-io",
    "rust/bundlebase-connector",
    "rust/bundlebase-index",
    "rust/bundlebase-data",
    "rust/bundlebase-udf",
    "rust/bundlebase",
    "rust/bundlebase-catalog",
    "rust/bundlebase-command",
    "rust/bundlebase-python",
    "rust/bundlebase-cli",
    "rust/bundlebase-report",
    "sdk/rust",
]
resolver = "2"

[workspace.package]
version = "0.14.0"
edition = "2021"
license = "Apache-2.0"
homepage = "https://github.com/nvoxland/bundlebase"
repository = "https://github.com/nvoxland/bundlebase"
authors = ["Nathan Voxland <nathan@voxland.net>"]

[workspace.dependencies]
bundlebase-common = { path = "rust/bundlebase-common" }
bundlebase-ossie = { path = "rust/bundlebase-ossie" }
bundlebase-connector = { path = "rust/bundlebase-connector" }
bundlebase-index = { path = "rust/bundlebase-index" }
bundlebase-data = { path = "rust/bundlebase-data" }
bundlebase-io = { path = "rust/bundlebase-io" }
bundlebase-udf = { path = "rust/bundlebase-udf" }
bundlebase-catalog = { path = "rust/bundlebase-catalog" }
bundlebase-command = { path = "rust/bundlebase-command" }
datafusion = { version = "55", features = ["avro"] }
arrow = { version = "59", features = ["ffi", "pyarrow"] }
arrow-flight = { version = "59", features = ["flight-sql-experimental"] }
arrow-schema = { version = "59", features = ["serde"] }
sqlparser = "0.62"
pest = "2.8"
pest_derive = "2.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "sync", "process", "signal"] }
tonic = "0.14"
serde = { version = "1.0", features = ["derive"] }
serde_yaml_ng = "0.10"
tar = "0.4"
flate2 = "1.0"
rstest = "0.27"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
tracing-opentelemetry = "0.34"
opentelemetry = "0.33"
opentelemetry_sdk = { version = "0.33", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.33", features = ["grpc-tonic", "logs"] }
opentelemetry-appender-tracing = "0.33"
serde_json = "1.0"
async-trait = "0.1"
futures = "0.3"
parking_lot = "0.12"
bytes = "1"
uuid = { version = "1.21", features = ["v4"] }
tempfile = "3.27"
tokio-util = { version = "0.7", features = ["io", "io-util"] }
object_store = { version = "0.13", features = ["aws", "gcp", "azure"] }
parquet = "59"
libloading = "0.9"
sha2 = { version = "0.11" }
xxhash-rust = { version = "0.8", features = ["xxh3"] }
serial_test = "4.0"
rand = "0.10"

[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"
debug = false

[profile.dev]
opt-level = 0
lto = false
codegen-units = 16
incremental = true  # Cache intermediate results
debug = "line-tables-only"  # file:line in backtraces; full debuginfo bloats target/ past CI disk

[profile.dev.package."*"]
debug = false  # no debuginfo for dependencies

[profile.test]
opt-level = 0
lto = false
codegen-units = 16
incremental = true  # Cache intermediate results
debug = "line-tables-only"

[profile.test.package."*"]
debug = false
