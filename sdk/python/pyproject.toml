[tool.poetry]
name = "bundlebase-sdk"
version = "0.1.0"
description = "SDK for building Bundlebase custom connectors"
readme = "README.md"
license = "Apache-2.0"
packages = [{include = "bundlebase_sdk"}]

[tool.poetry.dependencies]
python = ">=3.10"
pyarrow = ">=14.0.0"

[tool.poetry.group.dev.dependencies]
pytest = ">=7.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
