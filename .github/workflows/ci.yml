name: CI

on:
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '.context/**'
      - '*.md'
      - 'mkdocs.yml'
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '.context/**'
      - '*.md'
      - 'mkdocs.yml'

jobs:
  rust:
    name: Rust library
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install lld
        run: sudo apt-get install -y lld

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      - name: Run Rust tests
        env:
          RUSTFLAGS: "-C link-arg=-fuse-ld=lld"
        run: cargo test --verbose --package bundlebase

  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    needs: rust
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.13', '3.14']

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install lld
        run: sudo apt-get install -y lld

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
          cache-directories: target/maturin

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: latest
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Cache Poetry dependencies
        uses: actions/cache@v5
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ matrix.python-version }}-${{ hashFiles('**/poetry.lock') }}
          restore-keys: |
            venv-${{ runner.os }}-${{ matrix.python-version }}-

      - name: Install Python dependencies
        run: poetry install --no-interaction

      - name: Build Rust extension (development)
        env:
          RUSTFLAGS: "-C link-arg=-fuse-ld=lld"
          CARGO_TARGET_DIR: target/maturin
        run: |
          poetry run maturin build --out dist
          poetry run pip install --force-reinstall --no-deps dist/*.whl

      - name: Run Python tests
        run: poetry run pytest -v --timeout=300

      - name: Build Python wheel (release)
        env:
          RUSTFLAGS: "-C link-arg=-fuse-ld=lld"
          CARGO_TARGET_DIR: target/maturin
        run: poetry run maturin build --release --out dist-release

      - name: Upload Python wheel artifacts
        uses: actions/upload-artifact@v6
        with:
          name: wheels-py${{ matrix.python-version }}-${{ runner.os }}
          path: dist-release/*.whl
          retention-days: 30

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: test-results-py${{ matrix.python-version }}
          path: |
            target/
            .pytest_cache/
          retention-days: 7

  rust-sdk:
    name: Rust SDK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install lld
        run: sudo apt-get install -y lld

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      - name: Run Rust SDK tests
        env:
          RUSTFLAGS: "-C link-arg=-fuse-ld=lld"
        run: cargo test --verbose --package bundlebase-sdk

  go-sdk:
    name: Go SDK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.24'
          cache-dependency-path: sdk/go/go.sum

      - name: Run Go SDK tests
        working-directory: sdk/go
        run: go test -v ./bundlebasesdk/...

  java-sdk:
    name: Java SDK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '22'

      - name: Run Java SDK tests
        working-directory: sdk/java
        env:
          MAVEN_OPTS: "--add-opens=java.base/java.nio=ALL-UNNAMED --enable-native-access=ALL-UNNAMED"
        run: mvn test -B

  python-sdk:
    name: Python SDK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: latest
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Cache Poetry dependencies
        uses: actions/cache@v5
        with:
          path: sdk/python/.venv
          key: venv-sdk-python-${{ runner.os }}-${{ hashFiles('sdk/python/poetry.lock') }}
          restore-keys: |
            venv-sdk-python-${{ runner.os }}-

      - name: Install Python SDK dependencies
        working-directory: sdk/python
        run: poetry install --no-interaction

      - name: Run Python SDK tests
        working-directory: sdk/python
        run: poetry run pytest -v tests/

  build-cli:
    name: Build bundlebase-cli
    runs-on: ubuntu-latest
    needs: rust

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install lld
        run: sudo apt-get install -y lld

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      - name: Build bundlebase-cli (release)
        env:
          RUSTFLAGS: "-C link-arg=-fuse-ld=lld"
        run: cargo build --release --package bundlebase-cli

      - name: Upload bundlebase-cli binary
        uses: actions/upload-artifact@v6
        with:
          name: bundlebase-cli-${{ runner.os }}
          path: target/release/bundlebase
          retention-days: 30
